# ============================================================================
# GENERATED FILE — do not hand-edit. Source of truth is coffeepie_website/firebase.json.
# Regenerate:  node coffeepie_website/deploy/gen-coffeepie-nginx.mjs
# ============================================================================
# 31 rewrites and 20 redirects ported from firebase.json.
#
# Install on the SENA VM:
#   sudo cp coffeepie.co.nginx.conf /etc/nginx/sites-available/coffeepie.co
#   sudo ln -sf /etc/nginx/sites-available/coffeepie.co /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is NOT configured here. After DNS points at this host, run:
#   sudo certbot --nginx -d coffeepie.co -d www.coffeepie.co
# which edits this file in place to add :443 and the http->https redirect.
# Re-running the generator overwrites those edits — re-run certbot after.

server {
	listen 80;
	listen [::]:80;
	server_name coffeepie.co www.coffeepie.co;

	root /var/www/coffeepie.co;
	index index.html;
	charset utf-8;

	# Emit "Location: /pricing", not "Location: http://coffeepie.co/pricing".
	# nginx builds absolute redirects from the scheme it thinks it is serving,
	# which is wrong the moment anything fronts it — a tunnel, or certbot's
	# :443 block proxying internally — and an http:// Location on an https
	# page is a downgrade the browser has to be talked out of. Relative
	# redirects cannot get the scheme or the host wrong.
	absolute_redirect off;

	# Wix-era exports are heavy; 169 MB of assets over a self-hosted uplink.
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

	# Uploads are not a thing here, but the assistant POSTs JSON.
	client_max_body_size 1m;

# ---- 1) never serve these, whatever the URL says (firebase "ignore") ----
	location ~ /\.(?!well-known/) { return 404; }        # dotfiles, keep ACME
	location ~ ^/(node_modules|tools)/ { return 404; }
	location ~ ^/(package\.json|package-lock\.json|firebase\.json|firebase-debug\.log)$ { return 404; }
	location ~* \.(zip|rar|7z|tar|gz|py)$ { return 404; }

# ---- 1b) security headers (firebase.json "headers", the ** entry).
#          Repeated in every location below that sets Cache-Control — nginx
#          discards inherited add_header the moment a location declares one.
#          No CSP on purpose — see the header of the generator for why.
#          HSTS is inert over plain HTTP and takes effect once certbot has
#          added the TLS block. ----
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

# ---- 2) explicit redirects, before cleanUrls (see generator header) ----
	rewrite "^/princing$" "/pricing" permanent;
	rewrite "^/index\\.html$" "/" permanent;
	rewrite "^/precios$" "/pricing" permanent;
	rewrite "^/tienda$" "/store" permanent;
	rewrite "^/tutoriales$" "/tutorials" permanent;
	rewrite "^/acerca-de$" "/about" permanent;
	rewrite "^/fabricantes$" "/manufacturers" permanent;
	rewrite "^/proveedores-nube$" "/cloud-providers" permanent;
	rewrite "^/dispositivos-certificados$" "/certified-devices" permanent;
	rewrite "^/portal-inversionistas$" "/investor-portal" permanent;
	rewrite "^/portal-de-inversionistas$" "/investor-portal" permanent;
	rewrite "^/politica-de-envios$" "/shipping-policy" permanent;
	rewrite "^/politica-de-privacidad$" "/privacy-policy" permanent;
	rewrite "^/politica-de-retornos$" "/return-policy" permanent;
	rewrite "^/terminos-y-condiciones$" "/terms-and-conditions" permanent;
	rewrite "^/accesibilidad$" "/accessibility" permanent;
	rewrite "^/carrito$" "/cart" permanent;
	rewrite "^/pago-seguro$" "/secure-payment" permanent;
	rewrite "^/productos$" "/products" permanent;
	rewrite "^/productos/(.*)$" "/products/$1" permanent;

# ---- 3) cleanUrls parity: a direct .html request 301s to the bare form ----
	if ($request_uri ~ ^(.+)\.html(\?.*)?$) {
		return 301 $1$2;
	}

# ---- 4) internal rewrite table (URL bar unchanged) ----
	rewrite "^/precios$" "/pricing.html" last;
	rewrite "^/pricing$" "/pricing.html" last;
	rewrite "^/tienda$" "/store.html" last;
	rewrite "^/store$" "/store.html" last;
	rewrite "^/tutoriales$" "/tutorials.html" last;
	rewrite "^/tutorials$" "/tutorials.html" last;
	rewrite "^/acerca-de$" "/about.html" last;
	rewrite "^/about$" "/about.html" last;
	rewrite "^/api$" "/api.html" last;
	rewrite "^/politica-de-envios$" "/shipping-policy.html" last;
	rewrite "^/shipping-policy$" "/shipping-policy.html" last;
	rewrite "^/politica-de-privacidad$" "/privacy-policy.html" last;
	rewrite "^/privacy-policy$" "/privacy-policy.html" last;
	rewrite "^/politica-de-retornos$" "/return-policy.html" last;
	rewrite "^/return-policy$" "/return-policy.html" last;
	rewrite "^/terminos-y-condiciones$" "/terms-and-conditions.html" last;
	rewrite "^/terms-and-conditions$" "/terms-and-conditions.html" last;
	rewrite "^/portal-inversionistas$" "/investor-portal.html" last;
	rewrite "^/investor-portal$" "/investor-portal.html" last;
	rewrite "^/accesibilidad$" "/accessibility.html" last;
	rewrite "^/accessibility$" "/accessibility.html" last;
	rewrite "^/dispositivos-certificados$" "/certified-devices.html" last;
	rewrite "^/certified-devices$" "/certified-devices.html" last;
	rewrite "^/fabricantes$" "/manufacturers.html" last;
	rewrite "^/manufacturers$" "/manufacturers.html" last;
	rewrite "^/proveedores-nube$" "/cloud-providers.html" last;
	rewrite "^/cloud-providers$" "/cloud-providers.html" last;
	rewrite "^/pago-seguro$" "/secure-payment.html" last;
	rewrite "^/secure-payment$" "/secure-payment.html" last;
	rewrite "^/carrito$" "/cart.html" last;
	rewrite "^/cart$" "/cart.html" last;

# ---- 5) the assistant. Same origin as the page on purpose: no CORS
#         preflight, one less round trip, one less thing to misconfigure.
#         On this host the chat container reaches the model over the SENA
#         internal bridge, so the autossh tunnel the VPS needed is gone. ----
	location = /v1/chat {
		proxy_pass         http://127.0.0.1:8791;
		proxy_http_version 1.1;
		proxy_set_header   Host              $host;
		proxy_set_header   X-Real-IP         $remote_addr;
		proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header   X-Forwarded-Proto $scheme;
		# A cold prompt on one GPU is slow. The service gives up at
		# CHAT_TIMEOUT_MS (30s) and answers from the KB instead, so nginx has to
		# outlast it or the visitor gets a 504 instead of that graceful fallback.
		proxy_read_timeout 45s;
		proxy_send_timeout 45s;
		# The route is anonymous by design; same origin means the browser would
		# now attach session cookies. Strip them so that stays true.
		proxy_set_header   Cookie        "";
		proxy_set_header   Authorization "";
	}
	location = /v1/chat/health {
		proxy_pass       http://127.0.0.1:8791;
		proxy_set_header Host $host;
		proxy_set_header Cookie "";
		access_log       off;
	}

# ---- 6) cache headers (firebase.json "headers") ----
	location ~* \.(jpg|jpeg|gif|png|webp|avif|svg)$ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=2592000, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
	}
	location ~* \.(woff|woff2|ttf|otf|eot)$ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header Access-Control-Allow-Origin "*";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
	}
	location ~* \.(js|css)$ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=604800";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
	}
	location ~* \.html$ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=3600, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
	}
	# Explicit Content-Type: these are served to crawlers, and nosniff above
	# means a wrong or missing type is fatal rather than merely untidy.
	location ~ ^/(sitemap|en_en-sitemap)\.xml$ {
		try_files $uri =404;
		default_type application/xml;
		add_header Cache-Control "public, max-age=86400";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
	}
	location = /robots.txt {
		try_files $uri =404;
		default_type text/plain;
		add_header Cache-Control "public, max-age=86400";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
	}

# ---- 7) extensionless resolution: /foo -> foo.html, / -> index.html.
#         This is the HTML path — "/" and every clean URL land here, not in
#         the \.html$ location above (the URI has no extension by then), so
#         the HTML cache policy has to be repeated. ----
	location / {
		try_files $uri $uri.html $uri/index.html $uri/ =404;
		add_header Cache-Control "public, max-age=3600, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
	}

	error_page 404 /404.html;
	location = /404.html { internal; }
}
