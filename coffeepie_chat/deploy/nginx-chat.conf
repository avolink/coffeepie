# Coffee Pie assistant — nginx snippet.
#
# ⚠ Va en el vhost de **coffeepie.co**, NO en el de api.coffeepie.co.
#
#   api.coffeepie.co está roto hoy: responde 301 hacia sí mismo en todas las
#   rutas (bucle de redirección), así que nada servido ahí es alcanzable. El
#   asistente no debe depender de que eso se arregle.
#
#   Colgarlo del sitio principal además lo deja en el MISMO ORIGEN que la
#   página, así que el navegador no manda preflight CORS: un viaje menos por
#   mensaje, y una cosa menos que pueda romperse en producción.
#
# En HestiaCP: Web → coffeepie.co → Editar → "Nginx Additional directives",
# pegar, guardar. Hestia recarga nginx solo.
#
# El contenedor del chat es un proceso SEPARADO del backend del panel. Sólo
# estas dos rutas llegan a él; todo lo demás del vhost sigue sirviéndose como
# hasta ahora. `location = ` es coincidencia exacta y gana a cualquier
# `location /`, así que el orden dentro del bloque da igual.

location = /v1/chat {
    proxy_pass         http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Un 14B en una sola GPU tarda en un prompt frío. El servicio se rinde a los
    # CHAT_TIMEOUT_MS (30 s) y responde desde la base de conocimiento, así que
    # nginx tiene que aguantar más que eso o el visitante recibe un 504 en vez
    # de la degradación elegante que la ruta implementa a propósito.
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;

    # La ruta es anónima por diseño. Al estar ahora en el mismo origen que el
    # sitio, el navegador SÍ mandaría las cookies de sesión: vaciarlas aquí
    # mantiene la propiedad de que el asistente nunca ve una sesión.
    proxy_set_header   Cookie        "";
    proxy_set_header   Authorization "";
}

location = /v1/chat/health {
    proxy_pass       http://127.0.0.1:8791;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    access_log       off;
}
