# Weekly dependency update PRs (supply-chain hygiene). Vendored upstream code
# (coffeepie_backend/sunshine, coffeepie_frontend/moonlight-embedded) is not
# listed: patch it by re-syncing upstream, not by bumping in place.
version: 2
updates:
  - package-ecosystem: pip
    directory: /coffeepie_backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /coffeepie_backend/proxmox_backend
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /coffeepie_backend/panel_backend
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /coffeepie_orchestrator/server
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /coffeepie_orchestrator/actor
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
