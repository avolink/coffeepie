name: Test OpenUDS
permissions:
  contents: read

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

jobs:
  test:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Less than 3.14, due to pqcrypto right now (1/2026)
          python-version: 3.13

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsasl2-dev \
            libxmlsec1-dev \
            python3-dev \
            libldap2-dev \
            libssl-dev \
            libmemcached-dev \
            zlib1g-dev \
            gcc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install lxmlsec with local libraries to avoid binary wheel issues
          pip install --upgrade --no-binary lxml --no-binary xmlsec lxml xmlsec
          # Install other requirements
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD/src" >> $GITHUB_ENV

      - name: Copy Django settings
        run: cp src/server/settings.py.sample src/server/settings.py

      - name: Generate throwaway test secrets
        # settings.py.sample refuses to start without these (no embedded keys).
        run: |
          openssl genrsa 2048 > private.pem
          RSA_KEY=$(awk 'NF {sub(/\r/, ""); printf "%s\\n",$0;}' private.pem)
          echo "UDS_RSA_KEY=$RSA_KEY" >> $GITHUB_ENV
          echo "UDS_SECRET_KEY=$(openssl rand -base64 64 | tr -d '\n')" >> $GITHUB_ENV
          echo "UDS_DB_PASSWORD=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "UDS_ALLOWED_HOSTS=localhost,127.0.0.1" >> $GITHUB_ENV
          echo "UDS_DEBUG=1" >> $GITHUB_ENV

      - name: Create log directory
        run: mkdir -p src/log

      - name: Run tests with pytest
        run: python3 -m pytest
